name: Release

# v1.0.0 のようなバージョンタグが push されたら、配布用 ZIP を作って Release を公開する
on:
  push:
    tags:
      - "v*.*.*"

# Release の作成に必要
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: バージョンの整合性を確認
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version fanza-dl-name/manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::タグ ($TAG_VERSION) と manifest.json ($MANIFEST_VERSION) のバージョンが一致しません"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: 配布用 ZIP を作成
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 配布物として LICENSE・README・README から参照している画像を同梱する
          cp LICENSE README.md fanza-dl-name/
          cp -r img fanza-dl-name/
          # -X: 余計なファイル属性を含めない
          zip -r -X "fanza-dl-name-${VERSION}.zip" fanza-dl-name

      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "fanza-dl-name-${VERSION}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
